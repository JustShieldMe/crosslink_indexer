[package]
name = "crosslink-indexer"
version = "0.1.0"
edition = "2021"
description = "Analytics indexer for a Crosslink node: mining, staking actions, and finalizer behaviour"
license = "MIT OR Apache-2.0"

[dependencies]
# The ONLY link to the node. This is the monolith's FORK of zcash_primitives --
# it carries the `bft` module (BftBlock / FatPointerToBftBlock) and the
# VCrosslink transaction variant that hold every staking action. The crates.io
# crate of the same name and version has none of that, so this path is load
# bearing; see README "Why this repo is not dependency-free".
zcash_primitives = { path = "../crosslink_monolith/librustzcash/zcash_primitives" }
# BranchId lives here, not in zcash_primitives; depend on it explicitly rather
# than relying on a re-export.
zcash_protocol = { path = "../crosslink_monolith/librustzcash/components/zcash_protocol" }

rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.12", features = ["json"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hex = "0.4"

[profile.release]
opt-level = 3
